services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: campusbite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campusbite}
      POSTGRES_DB: campusbite
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - campusbite-db:/var/lib/postgresql/data
volumes:
  campusbite-db:
